[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-ai"
version = "0.1.0"
description = "Turn plain English into shell commands from your terminal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.scripts]
ask = "ask_ai.main:app"

[tool.setuptools]
packages = ["ask_ai"]
